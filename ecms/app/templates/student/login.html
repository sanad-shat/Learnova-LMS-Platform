<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Sign In | Learnova LMS</title>
  <link rel="icon" href="{{ url_for('static', filename='brand/learnova-icon.svg') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --navy: #0f172a;
      --slate: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
    }

    .brand-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .brand-header p {
      font-size: 14px;
      color: var(--slate);
    }

    /* Flash Message */
    .flash {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .flash.danger, .flash.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fee2e2;
    }
    .flash.success {
      background: #f0fdf4;
      color: #16a34a;
      border: 1px solid #dcfce7;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .input-wrap:focus-within {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .input-wrap i.field-icon {
      padding-left: 14px;
      color: #94a3b8;
      font-size: 15px;
    }

    .input-wrap input {
      width: 100%;
      padding: 12px 14px;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      color: var(--navy);
    }

    .input-wrap input::placeholder {
      color: #94a3b8;
    }

    .eye-btn {
      background: none;
      border: none;
      padding: 0 14px;
      cursor: pointer;
      color: #94a3b8;
      font-size: 15px;
    }

    .eye-btn:hover {
      color: var(--primary);
    }

    .form-extras {
      display: flex;
      justify-content: flex-end;
      margin-top: -6px;
      margin-bottom: 20px;
    }

    .form-extras a {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
    }

    .form-extras a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--slate);
      text-decoration: none;
    }

    .back-home:hover {
      color: var(--primary);
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="brand-header">
      <img src="{{ url_for('static', filename='brand/learnova-icon.svg') }}" alt="Learnova" class="brand-icon">
      <h1>Student Login</h1>
      <p>Enter your credentials to access your account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label for="email">Username or Email</label>
        <div class="input-wrap">
          <i class="fa-regular fa-envelope field-icon"></i>
          <input id="email" type="text" name="email" placeholder="Enter your email" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock field-icon"></i>
          <input id="password" type="password" name="password" placeholder="Enter your password" required>
          <button type="button" class="eye-btn" id="togglePassword">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="form-extras">
        <a href="#">Forgot Password?</a>
      </div>

      <button class="btn-submit" type="submit">Sign In</button>
    </form>

    <a href="/" class="back-home">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
  </div>

  <script>
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.classList.toggle('fa-eye', !isPassword);
        eyeIcon.classList.toggle('fa-eye-slash', isPassword);
      });
    }
  </script>
</body>
</html>
