{% extends "teacher/base.html" %}
{% block title %}Edit Exam | {{ course.name }}{% endblock %}

{% block content %}
<div class="form-page-container" style="max-width: 900px; margin: 30px auto; padding: 0 15px;">
  <div class="card" style="background: #ffffff; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #edf2f7; padding: 35px;">
    
    <!-- Header -->
    <div style="display: flex; align-items: center; gap: 18px; margin-bottom: 28px;">
      <div style="width: 52px; height: 52px; background: #3b82f6; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px;">
        <i class="fa-solid fa-file-signature"></i>
      </div>
      <div>
        <h2 style="margin: 0; font-size: 22px; font-weight: 700; color: #1e293b;">Exam Details</h2>
        <p style="margin: 4px 0 0; color: #64748b; font-size: 14px;">Edit the exam title, total score, and scheduled examination period.</p>
      </div>
    </div>

    <form method="POST" action="{{ url_for('teachers.edit_exam_page', teacher_id=teacher.id, course_id=course.id, exam_id=exam.id) }}">
      
      <!-- Exam Title -->
      <div style="margin-bottom: 22px;">
        <label style="display: block; font-weight: 600; color: #1e293b; font-size: 14px; margin-bottom: 8px;">Exam Title</label>
        <input type="text" name="title" value="{{ exam.title }}" required style="width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 12px 16px; font-size: 15px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'">
      </div>

      <!-- Total Score & Dates -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 22px;">
        <div>
          <label style="display: block; font-weight: 600; color: #1e293b; font-size: 14px; margin-bottom: 8px;">Total Score</label>
          <input type="number" step="0.5" name="total_score" value="{{ exam.total_score }}" required style="width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 12px 16px; font-size: 15px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'">
        </div>
        <div>
          <label style="display: block; font-weight: 600; color: #1e293b; font-size: 14px; margin-bottom: 8px;">Start Date & Time</label>
          <input type="datetime-local" name="start_date" value="{{ exam.start_date.strftime('%Y-%m-%dT%H:%M') if exam.start_date else '' }}" required style="width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 12px 16px; font-size: 15px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'">
        </div>
      </div>

      <!-- End Date -->
      <div style="margin-bottom: 22px;">
        <label style="display: block; font-weight: 600; color: #1e293b; font-size: 14px; margin-bottom: 8px;">End Date & Time</label>
        <input type="datetime-local" name="end_date" value="{{ exam.end_date.strftime('%Y-%m-%dT%H:%M') if exam.end_date else '' }}" required style="width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 12px 16px; font-size: 15px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'">
      </div>

      <!-- Description -->
      <div style="margin-bottom: 28px;">
        <label style="display: block; font-weight: 600; color: #1e293b; font-size: 14px; margin-bottom: 8px;">Instructions / Description</label>
        <textarea name="description" rows="5" placeholder="Rules, duration limits, and examination guidelines..." style="width: 100%; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; font-size: 14px; outline: none; line-height: 1.6; resize: vertical; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'">{{ exam.description or '' }}</textarea>
      </div>

      <!-- Actions -->
      <div style="display: flex; justify-content: flex-end; gap: 12px; padding-top: 15px; border-top: 1px solid #f1f5f9;">
        <a href="{{ url_for('teachers.view_course', teacher_id=teacher.id, course_id=course.id) }}" style="padding: 10px 22px; border-radius: 10px; background: #f1f5f9; color: #475569; text-decoration: none; font-weight: 600; font-size: 14px; border: none; display: inline-flex; align-items: center;">Cancel</a>
        <button type="submit" style="padding: 10px 26px; border-radius: 10px; background: #3b82f6; color: #fff; font-weight: 600; font-size: 14px; border: none; cursor: pointer; display: inline-flex; align-items: center; box-shadow: 0 4px 12px rgba(59,130,246,0.25);">Save Changes</button>
      </div>

    </form>
  </div>
</div>
{% endblock %}
