{% extends 'teacher/base.html' %}
{% block title %}Edit Exam | {{ exam.title }}{% endblock %}

{% block content %}
<style>
  .edit-exam-shell {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    box-sizing: border-box;
  }
  .form-card-box {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
  }
  .form-group-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }
  .form-group-item label {
    font-size: 0.88rem;
    font-weight: 700;
    color: #334155;
  }
  .form-input {
    width: 100%;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 0.92rem;
    outline: none;
    box-sizing: border-box;
  }
  .form-input:focus {
    border-color: #4f46e5;
  }
</style>

<div class="edit-exam-shell">
  <div style="margin-bottom: 20px;">
    <a href="/teacher/{{ teacher.id }}/courses/{{ course.id }}" style="color: #4f46e5; text-decoration: none; font-weight: 700; font-size: 0.85rem;">
      <i class="fa-solid fa-arrow-left"></i> Back to Course
    </a>
    <h1 style="font-size: 1.7rem; font-weight: 800; color: #0f172a; margin: 8px 0 4px;">Edit Exam Details</h1>
  </div>

  <div class="form-card-box">
    <form method="POST">
      <div class="form-group-item">
        <label>Exam Title</label>
        <input type="text" name="title" class="form-input" value="{{ exam.title }}" required>
      </div>

      <div class="form-group-item">
        <label>Total Score (Points)</label>
        <input type="number" step="0.5" name="total_score" class="form-input" value="{{ exam.total_score }}" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group-item">
          <label>Start Date & Time</label>
          <input type="datetime-local" name="start_date" class="form-input" value="{{ exam.start_date.strftime('%Y-%m-%dT%H:%M') if exam.start_date else '' }}" required>
        </div>
        <div class="form-group-item">
          <label>End Date & Time</label>
          <input type="datetime-local" name="end_date" class="form-input" value="{{ exam.end_date.strftime('%Y-%m-%dT%H:%M') if exam.end_date else '' }}" required>
        </div>
      </div>

      <div class="form-group-item">
        <label>Instructions & Examination Guidelines</label>
        <textarea name="description" rows="4" class="form-input" style="resize: vertical;">{{ exam.description or '' }}</textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px;">
        <a href="/teacher/{{ teacher.id }}/courses/{{ course.id }}" style="padding: 10px 20px; border-radius: 10px; background: #f1f5f9; color: #475569; text-decoration: none; font-weight: 700;">Cancel</a>
        <button type="submit" style="padding: 10px 24px; border-radius: 10px; background: #4f46e5; color: #fff; border: none; font-weight: 700; cursor: pointer;">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
