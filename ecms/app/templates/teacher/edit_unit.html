<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Unit - {{ unit.title }}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin:0; padding:0; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        h2 { margin-top: 0; color: #2c3e50; }
        .btn-primary { background: #3498db; border: none; }
        .btn-primary:hover { background: #2980b9; }
        .btn-secondary { background: #7f8c8d; border: none; }
        .btn-secondary:hover { background: #636e72; }
        .btn-danger { background: #e74c3c; border: none; }
        .btn-danger:hover { background: #c0392b; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='professional.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='brand/learnova-icon.svg') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow-lg max-w-2xl mx-auto">
            <h2 class="mb-4 text-center">Edit Unit</h2>

            <form method="POST" action="{{ url_for('teachers.edit_unit_page', teacher_id=teacher.id, course_id=course.id, unit_id=unit.id) }}" enctype="multipart/form-data">
                
                <!-- Unit Title -->
                <div class="mb-3">
                    <label for="title" class="form-label font-bold">Unit Title</label>
                    <input type="text" class="form-control" id="title" name="title" value="{{ unit.title }}" required>
                </div>

                <!-- Unit Content -->
                <div class="mb-3">
                    <label for="content" class="form-label font-bold">Unit Content</label>
                    <textarea class="form-control" id="content" name="content" rows="5" placeholder="Enter unit content">{{ unit.content or '' }}</textarea>
                </div>

                <!-- File Action Block -->
                {% if unit.file_path %}
                <div class="mb-3">
                    <label class="form-label font-bold">Current File:</label>
                    <p>
                        <a href="{{ url_for('teachers.uploaded_file', filename=unit.file_path) }}" target="_blank" class="text-primary text-decoration-none">
                            <i class="fa-solid fa-paperclip me-1"></i>{{ unit.file_path.split('_', 1)[-1] }}
                        </a>
                    </p>
                    <!-- Replace File -->
                    <div class="mb-2">
                        <label for="file" class="form-label">Replace File (Optional):</label>
                        <input class="form-control" type="file" id="file" name="file">
                    </div>
                </div>
                {% else %}
                <!-- Upload File if none exists -->
                <div class="mb-3">
                    <label for="file" class="form-label font-bold">Attach File (Optional):</label>
                    <input class="form-control" type="file" id="file" name="file">
                </div>
                {% endif %}

                <!-- Buttons -->
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-primary px-5">Save Changes</button>
                    <a href="{{ url_for('teachers.view_course', teacher_id=teacher.id, course_id=course.id) }}" class="btn btn-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
