{% extends 'admin/base.html' %}
{% block title %}Students Management | Learnova LMS{% endblock %}

{% block content %}
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-soft: rgba(79, 70, 229, 0.08);
    --slate-900: #0f172a;
    --slate-800: #1e293b;
    --slate-700: #334155;
    --slate-600: #475569;
    --slate-500: #64748b;
    --slate-400: #94a3b8;
    --slate-200: #e2e8f0;
    --slate-100: #f1f5f9;
    --slate-50: #f8fafc;
    --success-bg: #ecfdf5;
    --success-text: #059669;
    --success-border: #a7f3d0;
    --danger-soft: #fef2f2;
    --danger-text: #dc2626;
  }

  /* فك قيود العرض وتوسيع المساحة */
  .content, .app-main {
    max-width: 100% !important;
    width: 100% !important;
    padding-left: 20px !important;
    padding-right: 20px !important;
  }

  .admin-page-shell {
    width: 100% !important;
    max-width: 100% !important;
    padding: 24px 16px 60px !important;
    margin: 0 !important;
    box-sizing: border-box;
    font-family: inherit;
  }

  /* Header Section */
  .page-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--slate-200);
    width: 100%;
  }

  .page-title-group h5 {
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--primary);
    margin: 0 0 4px;
  }

  .page-title-group h1 {
    font-size: 1.85rem;
    font-weight: 800;
    color: var(--slate-900);
    letter-spacing: -0.025em;
    margin: 0 0 4px;
    line-height: 1.2;
  }

  .page-title-group p {
    font-size: 0.9rem;
    color: var(--slate-500);
    margin: 0;
  }

  .btn-add-primary {
    background: var(--primary);
    color: #ffffff;
    font-size: 0.88rem;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 10px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
    transition: all 0.2s ease;
    border: none;
    cursor: pointer;
  }

  .btn-add-primary:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
  }

  /* KPI Summary Mini-Bar */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
    width: 100%;
  }

  .kpi-card {
    background: #ffffff;
    border: 1px solid var(--slate-200);
    border-radius: 14px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
  }

  .kpi-card .kpi-num {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--slate-900);
    line-height: 1;
    margin-bottom: 4px;
  }

  .kpi-card .kpi-lbl {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--slate-500);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .kpi-card .kpi-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--slate-100);
    color: var(--slate-700);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }

  /* Table Card */
  .directory-card {
    background: #ffffff;
    border: 1px solid var(--slate-200);
    border-radius: 18px;
    box-shadow: 0 2px 12px rgba(15, 23, 42, 0.03);
    overflow: hidden;
    width: 100%;
    box-sizing: border-box;
  }

  .directory-toolbar {
    padding: 16px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    border-bottom: 1px solid var(--slate-200);
    background: #ffffff;
  }

  .directory-meta {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .directory-icon-box {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--primary-soft);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }

  .directory-meta h3 {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--slate-900);
    margin: 0;
  }

  .directory-meta span {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--slate-500);
  }

  .search-input-box {
    position: relative;
    width: 260px;
    max-width: 100%;
  }

  .search-input-box i {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--slate-400);
    font-size: 0.82rem;
  }

  .search-input-box input {
    width: 100%;
    padding: 8px 12px 8px 34px;
    font-size: 0.86rem;
    border: 1.5px solid var(--slate-200);
    border-radius: 9px;
    background: var(--slate-50);
    color: var(--slate-900);
    box-sizing: border-box;
    transition: all 0.2s ease;
  }

  .search-input-box input:focus {
    outline: none;
    border-color: var(--primary);
    background: #ffffff;
    box-shadow: 0 0 0 3px var(--primary-soft);
  }

  .table-responsive-wrapper {
    width: 100%;
    overflow-x: auto;
  }

  .modern-data-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 0.86rem;
  }

  .modern-data-table thead th {
    background: var(--slate-50);
    padding: 12px 18px;
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--slate-500);
    border-bottom: 1px solid var(--slate-200);
    white-space: nowrap;
  }

  .modern-data-table tbody tr {
    border-bottom: 1px solid var(--slate-100);
    transition: background 0.15s ease;
  }

  .modern-data-table tbody tr:hover {
    background: #fafbff;
  }

  .modern-data-table td {
    padding: 14px 18px;
    vertical-align: middle;
    color: var(--slate-700);
  }

  .student-profile-cell {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .student-avatar {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), #6366f1);
    color: #ffffff;
    font-weight: 800;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .student-name-col strong {
    display: block;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--slate-900);
  }

  .student-name-col small {
    display: block;
    font-size: 0.76rem;
    color: var(--slate-400);
  }

  .badge-dept {
    background: var(--slate-100);
    color: var(--slate-700);
    padding: 3px 9px;
    border-radius: 7px;
    font-weight: 600;
    font-size: 0.78rem;
    display: inline-block;
  }

  .badge-status-active {
    background: var(--success-bg);
    color: var(--success-text);
    border: 1px solid var(--success-border);
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.7rem;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .badge-status-active::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--success-text);
  }

  .course-pill {
    background: #eff6ff;
    color: #2563eb;
    border: 1px solid #bfdbfe;
    padding: 2px 7px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.72rem;
    display: inline-block;
    margin: 1px;
  }

  .actions-cell-wrap {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    position: relative;
  }

  .btn-quick-edit {
    padding: 6px 12px;
    font-size: 0.78rem;
    font-weight: 700;
    border-radius: 8px;
    background: #eff6ff;
    color: #2563eb;
    border: 1px solid #bfdbfe;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-quick-edit:hover {
    background: #2563eb;
    color: #ffffff;
  }

  .dropdown-action-wrap {
    position: relative;
    display: inline-block;
  }

  .btn-dots-menu {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--slate-100);
    border: none;
    color: var(--slate-600);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-dots-menu:hover {
    background: var(--slate-200);
    color: var(--slate-900);
  }

  .action-menu-dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 36px;
    background: #ffffff;
    border: 1px solid var(--slate-200);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    min-width: 170px;
    z-index: 50;
    padding: 6px;
  }

  .action-menu-dropdown.show {
    display: block;
  }

  .action-menu-dropdown a, 
  .action-menu-dropdown button {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--slate-700);
    text-decoration: none;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    border-radius: 7px;
    cursor: pointer;
    box-sizing: border-box;
    transition: all 0.15s ease;
  }

  .action-menu-dropdown a:hover, 
  .action-menu-dropdown button:hover {
    background: var(--slate-50);
    color: var(--slate-900);
  }

  .action-menu-dropdown .item-danger {
    color: var(--danger-text);
  }

  .action-menu-dropdown .item-danger:hover {
    background: var(--danger-soft);
    color: var(--danger-text);
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-overlay.active {
    display: flex;
  }

  .modal-card {
    background: #ffffff;
    border-radius: 18px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    overflow: hidden;
  }

  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--slate-200);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-header h3 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--slate-900);
  }

  .modal-close-btn {
    background: transparent;
    border: none;
    font-size: 1
