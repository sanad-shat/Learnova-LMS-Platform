<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Course</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #ece9e6, #ffffff); 
            margin: 0; 
            padding: 0; 
        }
        main { 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card { 
            background: #fff; 
            padding: 30px 25px;
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 700px; 
            box-sizing: border-box;
        }
        h2 { 
            text-align: center; 
            margin-bottom: 30px; 
            color: #2c3e50;
            font-size: 28px;
        }
        form { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px;
        }
        .form-group { 
            flex: 1 1 45%; 
            display: flex; 
            flex-direction: column; 
        }
        .form-group.full { flex: 1 1 100%; }
        label { 
            margin-bottom: 6px; 
            font-weight: 600; 
            color: #34495e;
        }
        input, select, textarea { 
            padding: 12px 15px; 
            border: none; 
            border-radius: 12px; 
            background: #f5f5f5; 
            font-size: 15px;
            outline: none;
            transition: background 0.3s, box-shadow 0.3s;
            width: 100%;
            box-sizing: border-box;
        }
        textarea { 
            resize: none; 
            min-height: 80px;
        }
        input:focus, select:focus, textarea:focus {
            background: #e8f0fe;
            box-shadow: 0 0 0 2px #2c3e50;
        }
        .buttons { 
            flex: 1 1 100%; 
            display: flex; 
            gap: 15px; 
            justify-content: flex-end; 
            margin-top: 20px;
        }
        button, a.button { 
            padding: 12px 20px; 
            border-radius: 12px; 
            border: none; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            color: white;
            transition: background 0.3s, transform 0.2s;
        }
        button { background: #2c3e50; }
        button:hover { background: #34495e; transform: translateY(-2px); }
        a.button { background: #7f8c8d; }
        a.button:hover { background: #626d70; transform: translateY(-2px); }
    </style>
<link rel="stylesheet" href="{{ url_for('static', filename='professional.css') }}"><link rel="icon" href="{{ url_for('static',filename='brand/learnova-icon.svg') }}"></head>
<body>
<main>
    <div class="card">
        <h2>Edit Course</h2>
        <form method="POST">
            <div class="form-group">
                <label>Course Code:</label>
                <input type="text" name="code" value="{{ course.code }}" required>
            </div>
            <div class="form-group">
                <label>Course Name:</label>
                <input type="text" name="name" value="{{ course.name }}" required>
            </div>
            <div class="form-group full">
                <label>Description:</label>
                <textarea name="description">{{ course.description }}</textarea>
            </div>
            <div class="form-group">
                <label>Teacher:</label>
                <select name="teacher_id">
                    <option value="">Select Teacher</option>
                    {% for teacher in teachers %}
                        <option value="{{ teacher.id }}" {% if course.teacher and teacher.id == course.teacher.id %}selected{% endif %}>
                            {{ teacher.username }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Course Identifier:</label>
                <input type="text" name="course_identifier" value="{{ course.course_identifier }}" required>
            </div>
            <div class="buttons">
                <button type="submit">Save Changes</button>
                <a href="{{ url_for('admin.manage_courses') }}" class="button">Back</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
