{% extends 'admin/base.html' %}
{% block title %}Edit Course | {{ course.name }}{% endblock %}

{% block content %}
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-soft: rgba(79, 70, 229, 0.08);
    --primary-border: rgba(79, 70, 229, 0.2);
    --slate-900: #0f172a;
    --slate-800: #1e293b;
    --slate-700: #334155;
    --slate-600: #475569;
    --slate-500: #64748b;
    --slate-400: #94a3b8;
    --slate-200: #e2e8f0;
    --slate-100: #f1f5f9;
    --slate-50: #f8fafc;
  }

  .content, .app-main {
    max-width: 100% !important;
    width: 100% !important;
    padding-left: 20px !important;
    padding-right: 20px !important;
  }

  .edit-page-shell {
    width: 100% !important;
    max-width: 100% !important;
    padding: 24px 20px 60px !important;
    margin: 0 !important;
    box-sizing: border-box;
    font-family: inherit;
  }

  .edit-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--slate-200);
    width: 100%;
  }

  .page-title-group h5 {
    font-size: 0.75rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--primary);
    margin: 0 0 4px;
  }

  .page-title-group h1 {
    font-size: 1.85rem;
    font-weight: 800;
    color: var(--slate-900);
    letter-spacing: -0.025em;
    margin: 0 0 4px;
  }

  .page-title-group p {
    font-size: 0.9rem;
    color: var(--slate-500);
    margin: 0;
  }

  .btn-back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--slate-600);
    text-decoration: none;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid var(--slate-200);
    background: #ffffff;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    transition: all 0.2s ease;
  }

  .btn-back-link:hover {
    background: var(--slate-50);
    color: var(--slate-900);
    border-color: var(--slate-300);
    transform: translateY(-1px);
  }

  .edit-card {
    background: #ffffff;
    border: 1px solid var(--slate-200);
    border-radius: 18px;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
    overflow: hidden;
    width: 100%;
    box-sizing: border-box;
  }

  .edit-card-header {
    padding: 18px 26px;
    border-bottom: 1px solid var(--slate-200);
    background: var(--slate-50);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .edit-card-header h3 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--slate-900);
  }

  .edit-form-body {
    padding: 28px 26px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .form-grid-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .form-group-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-group-block label {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--slate-700);
  }

  .form-group-block label .req {
    color: #ef4444;
  }

  .form-input-control {
    width: 100%;
    border: 1.5px solid var(--slate-200);
    border-radius: 12px;
    padding: 11px 16px;
    font-size: 0.92rem;
    color: var(--slate-800);
    background: #ffffff;
    outline: none;
    box-sizing: border-box;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .form-input-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--primary-soft);
  }

  .form-textarea-control {
    min-height: 100px;
    resize: vertical;
    line-height: 1.6;
  }

  .edit-card-footer {
    padding: 18px 26px;
    border-top: 1px solid var(--slate-200);
    background: var(--slate-50);
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
  }

  .btn-submit-save {
    background: var(--primary);
    color: #ffffff;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 11px 26px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
    transition: all 0.2s ease;
  }

  .btn-submit-save:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
  }

  @media (max-width: 768px) {
    .edit-page-shell { padding: 16px 12px 40px !important; }
    .form-grid-2col { grid-template-columns: 1fr; gap: 16px; }
    .edit-top-bar { flex-direction: column; align-items: stretch; }
    .btn-submit-save { width: 100%; justify-content: center; }
  }
</style>

<div class="edit-page-shell">
  <!-- Top Navigation & Action -->
  <div class="edit-top-bar">
    <div class="page-title-group">
      <h5>ACADEMIC CONFIGURATION</h5>
      <h1>Edit Course Details</h1>
      <p>Modify course code, assigned instructor, and curriculum overview.</p>
    </div>
    <div>
      <a href="/admin/courses" class="btn-back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Courses
      </a>
    </div>
  </div>

  <div class="edit-card">
    <div class="edit-card-header">
      <i class="fa-solid fa-pen-to-square text-primary" style="color: var(--primary);"></i>
      <h3>Course Information</h3>
    </div>

    <form method="POST" action="">
      <div class="edit-form-body">
        <div class="form-grid-2col">
          <div class="form-group-block">
            <label for="code">Course Code <span class="req">*</span></label>
            <input type="text" id="code" name="code" class="form-input-control" value="{{ course.code }}" required>
          </div>

          <div class="form-group-block">
            <label for="name">Course Name <span class="req">*</span></label>
            <input type="text" id="name" name="name" class="form-input-control" value="{{ course.name }}" required>
          </div>
        </div>

        <div class="form-group-block">
          <label for="description">Course Description</label>
          <textarea id="description" name="description" class="form-input-control form-textarea-control" placeholder="Provide a summary of the course syllabus and goals...">{{ course.description or '' }}</textarea>
        </div>

        <div class="form-grid-2col">
          <div class="form-group-block">
            <label for="teacher_id">Assigned Instructor</label>
            <select id="teacher_id" name="teacher_id" class="form-input-control">
              <option value="">Unassigned (None)</option>
              {% if teachers %}
                {% for teacher in teachers %}
                  <option value="{{ teacher.id }}" {% if course.teacher_id == teacher.id or (course.teacher and teacher.id == course.teacher.id) %}selected{% endif %}>
                    {{ teacher.name_person or teacher.username }} ({{ teacher.email }})
                  </option>
                {% endfor %}
              {% endif %}
            </select>
          </div>

          <div class="form-group-block">
            <label for="course_identifier">Course Identifier</label>
            <input type="text" id="course_identifier" name="course_identifier" class="form-input-control" 
                   value="{{ course.course_identifier if course.course_identifier is defined and course.course_identifier else (course.code or '') }}">
          </div>
        </div>
      </div>

      <div class="edit-card-footer">
        <a href="/admin/courses" class="btn-back-link" style="border: none; background: transparent; box-shadow: none;">Cancel</a>
        <button type="submit" class="btn-submit-save">
          <i class="fa-solid fa-check"></i> Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
