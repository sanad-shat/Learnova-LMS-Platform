<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Instructor</title><link rel="stylesheet" href="{{ url_for('static', filename='professional.css') }}"><link rel="icon" href="{{ url_for('static',filename='brand/learnova-icon.svg') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('admin.dashboard') }}">Learnova LMS</a><nav class="admin-nav"><a href="{{ url_for('admin.dashboard') }}">Dashboard</a><a href="{{ url_for('admin.manage_students') }}">Students</a><a href="{{ url_for('admin.manage_teachers') }}">Instructors</a><a href="{{ url_for('admin.manage_courses') }}">Courses</a><a href="{{ url_for('admin.reports_teachers') }}">Reports</a></nav></header><main class="container"><div class="page-heading"><div><span class="eyebrow">INSTRUCTOR MANAGEMENT</span><h1>Edit Instructor Profile</h1><p>Update professional, academic, and account details.</p></div></div><section class="form-card wide-form"><form method="POST">
<div class="form-grid">
  <div class="field full"><label>Full Name <span>*</span></label><input name="name_person" value="{{ teacher.name_person if teacher else '' }}" required></div>
  <div class="field"><label>Employee ID <span>*</span></label><input name="employee_id" value="{{ teacher.employee_id if teacher else '' }}" placeholder="e.g. EMP-1042" required></div>
  <div class="field"><label>Username <span>*</span></label><input name="username" value="{{ teacher.username if teacher else '' }}" required></div>
  <div class="field"><label>Email <span>*</span></label><input type="email" name="email" value="{{ teacher.email if teacher else '' }}" required></div>
  <div class="field"><label>Password {% if teacher %}<small>(leave blank to keep current)</small>{% else %}<span>*</span>{% endif %}</label><input type="password" name="password" {% if not teacher %}required{% endif %}></div>
  <div class="field"><label>Phone Number</label><input name="phone" value="{{ teacher.phone if teacher else '' }}"></div>
  <div class="field"><label>Department</label><select name="department"><option value="">Select department</option>{% for item in ['Software Engineering','Computer Science','Artificial Intelligence','Cyber Security','Information Technology','Data Science','Business'] %}<option value="{{ item }}" {% if teacher and teacher.department == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
  <div class="field"><label>Academic Rank</label><select name="academic_rank"><option value="">Select rank</option>{% for item in ['Teaching Assistant','Lecturer','Assistant Professor','Associate Professor','Professor'] %}<option value="{{ item }}" {% if teacher and teacher.academic_rank == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
  <div class="field"><label>Office Number</label><input name="office_number" value="{{ teacher.office_number if teacher else '' }}"></div>
  <div class="field"><label>Gender</label><select name="gender"><option value="">Select gender</option>{% for item in ['Male','Female'] %}<option value="{{ item }}" {% if teacher and teacher.gender == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
  <div class="field"><label>Status</label><select name="status">{% for item in ['Active','Inactive'] %}<option value="{{ item }}" {% if (teacher and teacher.status == item) or (not teacher and item == 'Active') %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
</div><div class="form-actions"><a class="secondary-btn" href="{{ url_for('admin.manage_teachers') }}">Cancel</a><button type="submit">Save Changes</button></div></form></section></main></body></html>
