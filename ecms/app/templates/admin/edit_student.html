<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Student</title><link rel="stylesheet" href="{{ url_for('static', filename='professional.css') }}"><link rel="icon" href="{{ url_for('static',filename='brand/learnova-icon.svg') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('admin.dashboard') }}">Learnova LMS</a><nav class="admin-nav"><a href="{{ url_for('admin.dashboard') }}">Dashboard</a><a href="{{ url_for('admin.manage_students') }}">Students</a><a href="{{ url_for('admin.manage_teachers') }}">Instructors</a><a href="{{ url_for('admin.manage_courses') }}">Courses</a><a href="{{ url_for('admin.reports_teachers') }}">Reports</a></nav></header><main class="container"><div class="page-heading"><div><span class="eyebrow">STUDENT MANAGEMENT</span><h1>Edit Student Profile</h1><p>Update academic, contact, and account details.</p></div></div><section class="form-card wide-form"><form method="POST">
<div class="form-grid">
  <div class="field full"><label>Full Name <span>*</span></label><input name="name_person" value="{{ student.name_person if student else '' }}" required></div>
  <div class="field"><label>University ID <span>*</span></label><input name="university_id" value="{{ student.university_id if student else '' }}" placeholder="e.g. 202410245" required></div>
  <div class="field"><label>Username <span>*</span></label><input name="username" value="{{ student.username if student else '' }}" required></div>
  <div class="field"><label>Email <span>*</span></label><input type="email" name="email" value="{{ student.email if student else '' }}" required></div>
  <div class="field"><label>Password {% if student %}<small>(leave blank to keep current)</small>{% else %}<span>*</span>{% endif %}</label><input type="password" name="password" {% if not student %}required{% endif %}></div>
  <div class="field"><label>Phone Number</label><input name="phone" value="{{ student.phone if student else '' }}" placeholder="+971 ..."></div>
  <div class="field"><label>Department</label><select name="department"><option value="">Select department</option>{% for item in ['Software Engineering','Computer Science','Artificial Intelligence','Cyber Security','Information Technology','Data Science','Business'] %}<option value="{{ item }}" {% if student and student.department == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
  <div class="field"><label>Academic Level</label><select name="level"><option value="">Select level</option>{% for item in ['Year 1','Year 2','Year 3','Year 4','Graduate'] %}<option value="{{ item }}" {% if student and student.level == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
  <div class="field"><label>Gender</label><select name="gender"><option value="">Select gender</option>{% for item in ['Male','Female'] %}<option value="{{ item }}" {% if student and student.gender == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
  <div class="field"><label>Status</label><select name="status">{% for item in ['Active','Inactive'] %}<option value="{{ item }}" {% if (student and student.status == item) or (not student and item == 'Active') %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div>
</div><div class="form-actions"><a class="secondary-btn" href="{{ url_for('admin.manage_students') }}">Cancel</a><button type="submit">Save Changes</button></div></form></section></main></body></html>
