<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="{{ url_for('static',filename='professional.css') }}"><link rel="icon" href="{{ url_for('static',filename='brand/learnova-icon.svg') }}"></head><body><main class="learnova-shell"><section class="learnova-card" style="max-width:800px;margin:auto;padding:32px"><h1>Edit Topic</h1><form method="post" enctype="multipart/form-data"><input name="title" value="{{ topic.title }}" required style="width:100%;margin-bottom:15px"><select name="topic_type" style="width:100%;margin-bottom:15px">{% for t in ['Question','Discussion','Announcement'] %}<option {% if topic.topic_type==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select><textarea name="body" rows="8" required style="width:100%;margin-bottom:15px">{{ topic.body }}</textarea><input type="file" name="attachment"><button>Save Changes</button></form></section></main></body></html>
