<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Topic | Learnova</title><link rel="stylesheet" href="{{ url_for('static',filename='professional.css') }}"><link rel="icon" href="{{ url_for('static',filename='brand/learnova-icon.svg') }}"></head><body><main class="learnova-shell"><section class="learnova-card" style="max-width:800px;margin:auto;padding:32px"><img src="{{ url_for('static',filename='brand/learnova-logo.svg') }}" style="width:220px"><h1>Create Discussion Topic</h1><form method="post" enctype="multipart/form-data"><label>Course</label><select name="course_id" required style="width:100%;margin:7px 0 18px">{% for c in courses %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select><label>Topic type</label><select name="topic_type" style="width:100%;margin:7px 0 18px"><option>Question</option><option>Discussion</option>{% if current_user.role in ['teacher','admin'] %}<option>Announcement</option>{% endif %}</select><label>Title</label><input name="title" required style="width:100%;margin:7px 0 18px"><label>Message</label><textarea name="body" required rows="7" style="width:100%;margin:7px 0 18px"></textarea><label>Attachment (optional)</label><input type="file" name="attachment" style="width:100%;margin:7px 0 20px"><button>Create Topic</button> <a href="{{ url_for('forum.index') }}">Cancel</a></form></section></main></body></html>
